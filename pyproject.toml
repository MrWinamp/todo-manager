[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-manager"
dynamic = ["version"]
description = "Simple FastAPI TODO task manager"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["todo", "task-manager"]
authors = [
  { name = "Alexander", email = "alexander-1082@mail.ru" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]"
]

[project.urls]
Documentation = "https://github.com/MrWinamp/todo-manager#readme"
Issues = "https://github.com/MrWinamp/todo-manager/issues"
Source = "https://github.com/MrWinamp/todo-manager"

[project.scripts]
todo-manager = "todo_manager.main:main"

[tool.hatch.version]
path = "src/todo_manager/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/todo_manager tests}"

[tool.coverage.run]
source_pkgs = ["todo_manager", "tests"]
branch = true
parallel = true
omit = [
  "src/todo_manager/__about__.py",
]

[tool.coverage.paths]
todo_manager = ["src/todo_manager", "*/todo-manager/src/todo_manager"]
tests = ["tests", "*/todo-manager/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]